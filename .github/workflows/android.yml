name: Sofacockpit Android APK

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'gradle/wrapper/**'
      - '.github/workflows/android.yml'
      - 'TONMASCHINE_LICENSE.md'
      - 'THIRD_PARTY_NOTICES.md'
      - 'third_party_licenses/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36
        shell: bash
        run: |
          SDKMANAGER=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -type f -name sdkmanager | head -n 1)
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Run JVM unit tests
        run: gradle --no-daemon :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Sofacockpit-Android-v0.3.2-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish installable APK
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create sofacockpit-v0.3.2 \
            app/build/outputs/apk/debug/app-debug.apk \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Sofacockpit v0.3.2 (RSA-PSS-Kompatibilität)" \
            --notes "Neue Keystore-Signaturidentität mit internem RSA-PSS/NoPadding-Selbsttest für Conscrypt, klarer Hinweis bei verweigertem Netzwerkzugriff. Private Schlüssel bleiben nicht exportierbar, TLS und Zertifikatsbindung bleiben aktiv. Gerätetest am TV steht aus. Debug-Signatur kann sich zwischen Builds ändern."
