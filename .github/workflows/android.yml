name: Sofacockpit Android APK

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'gradle/wrapper/**'
      - '.github/workflows/android.yml'
      - 'TONMASCHINE_LICENSE.md'
      - 'THIRD_PARTY_NOTICES.md'
      - 'third_party_licenses/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36
        shell: bash
        run: |
          SDKMANAGER=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -type f -name sdkmanager | head -n 1)
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Run JVM unit tests
        run: gradle --no-daemon :app:testDebugUnitTest --stacktrace

      - name: Build unsigned release APK
        run: gradle --no-daemon :app:assembleRelease --stacktrace

      - name: Sign release APK and verify fixed certificate
        shell: bash
        env:
          SOFACOCKPIT_KEYSTORE_BASE64: ${{ secrets.SOFACOCKPIT_KEYSTORE_BASE64 }}
          SOFACOCKPIT_KEYSTORE_PASSWORD: ${{ secrets.SOFACOCKPIT_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$SOFACOCKPIT_KEYSTORE_BASE64" || { echo "Missing signing keystore secret"; exit 1; }
          test -n "$SOFACOCKPIT_KEYSTORE_PASSWORD" || { echo "Missing signing password secret"; exit 1; }
          # The supplied password file ends with a newline. PKCS12 rejects
          # control characters; normalize only surrounding whitespace/BOM.
          SOFACOCKPIT_KEYSTORE_PASSWORD=$(python3 -c 'import os,sys; p=os.environ["SOFACOCKPIT_KEYSTORE_PASSWORD"].strip().lstrip("\ufeff").strip(); sys.exit("Signing password contains invalid characters") if not p or any(ord(c)<32 or ord(c)>126 for c in p) else sys.stdout.write(p)')
          export SOFACOCKPIT_KEYSTORE_PASSWORD
          printf '::add-mask::%s\n' "$SOFACOCKPIT_KEYSTORE_PASSWORD"
          keyfile=$(mktemp "$RUNNER_TEMP/sofacockpit-signing.XXXXXXXX.p12")
          trap 'rm -f "$keyfile"' EXIT
          printf '%s' "$SOFACOCKPIT_KEYSTORE_BASE64" | base64 --decode > "$keyfile"
          unset SOFACOCKPIT_KEYSTORE_BASE64
          tools="$ANDROID_HOME/build-tools/36.0.0"
          mkdir -p dist
          "$tools/apksigner" sign --ks "$keyfile" --ks-type PKCS12 \
            --ks-key-alias sofacockpit \
            --ks-pass env:SOFACOCKPIT_KEYSTORE_PASSWORD \
            --key-pass env:SOFACOCKPIT_KEYSTORE_PASSWORD \
            --out dist/Sofacockpit.apk \
            app/build/outputs/apk/release/app-release-unsigned.apk
          unset SOFACOCKPIT_KEYSTORE_PASSWORD
          "$tools/apksigner" verify --verbose --print-certs dist/Sofacockpit.apk | tee "$RUNNER_TEMP/apk-signature.txt"
          grep -Fx 'Signer #1 certificate SHA-256 digest: 6bc8b1ff2f2f2bc6db4c56d4ffa53c080c05f48089dab7b66ccb7d74fa54ac83' "$RUNNER_TEMP/apk-signature.txt"

      - name: Include standalone theme packages
        run: cp app/src/main/assets/themes/*.sofatheme dist/

      - uses: actions/upload-artifact@v4
        with:
          name: Sofacockpit-Android-v1.0.1
          path: dist/
          if-no-files-found: error
          retention-days: 90

      - name: Publish installable APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create sofacockpit-v1.0.1 \
            dist/Sofacockpit.apk dist/*.sofatheme \
            --target "$GITHUB_SHA" \
            --latest \
            --title "Sofacockpit v1.0.1 (Kompakte HDMI-Auswahl)" \
            --notes "Kompakterer Quellen-Screen: HDMI-Schnellwahltasten mit 48 dp Mindesthöhe statt 70 dp, kleinere Zeilenabstände, TV-Eingangsauswahl in derselben kompakten Höhe. Die Tasten können bei längeren Bezeichnungen oder großer Systemschrift mitwachsen. Anordnung, HDMI-Befehle, Umbenennen per langem Drücken, Apps-Bereich, Navigation und Updatefunktion bleiben unverändert. Reguläres Release mit unveränderter Signatur."
